name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - nisedo-dev
  pull_request:
    branches:
      - nisedo-dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-vm:
    name: core-vm
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: "1.24.x"
          cache: true

      - name: Cache repository-pinned build tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/cache
          key: ${{ runner.os }}-core-vm-tools-${{ hashFiles('build/checksums.txt') }}

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l core/vm)"
          if [[ -n "$files" ]]; then
            printf 'Unformatted files:\n%s\n' "$files"
            exit 1
          fi

      - name: Lint core VM
        run: go run build/ci.go lint ./core/vm/...

      - name: Test core VM
        run: go test -short -count=1 -timeout=10m ./core/vm/...
